name = "bottomup-analyst-proxy"
main = "analyst-worker.js"
compatibility_date = "2026-05-01"

# bottomup.app (the bare name) answers only through this Worker, which 301s every path to
# www.bottomup.app (the website, on Render). The lab-page routes (/analyst, /okx-closed-session,
# /vision2027, /gbah126, /_next, /__nextjs and their www variants) were removed on 22 October 2026
# when work.bupcore.ai was retired with Railway.
# Never add a www.bottomup.app route here: the Worker would redirect www to itself.
# `wrangler deploy` replaces the Worker's routes with this list, so the old www routes are
# removed by the same deploy.
routes = [
  { pattern = "bottomup.app/*", zone_name = "bottomup.app" }
]
